# dsh-ui-liteglass — bundle patch layer.
#
# Installed as a DSH profile bundle (`dsh.bundle.patch`). Mounts the host half
# of the plugin. The client half rides `dsh.client` in package.json and is
# served by client-modules at /plugins/dsh-ui-liteglass/client.js.
#
# `inject` is the HOST-side service list: `webServer` serves the routes,
# `connection` authenticates every request to them (the harness gate itself
# only covers index and /api), and `settings` supplies the native theme
# preference descriptor. File I/O uses node:fs directly, so no `fs` service is
# required.
- insert:
    - id: ui-liteglass
      name: 'dsh-ui-liteglass'
      inject:
        - webServer
        - settings
        - connection
